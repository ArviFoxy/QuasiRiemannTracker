name: Proof worker integration
on:
  pull_request:
    paths:
      - "verifier/**"
      - "core/standard-challenge.mjs"
      - "tests/actions-worker.py"
      - ".github/workflows/pr-admission.yml"
      - ".github/workflows/worker-integration.yml"
      - ".github/workflows/verifier-cache.yml"
      - ".github/actions/verifier-cache/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    # The proof sandbox needs AppArmor setup and delegated cgroups.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Exercise concurrent kernels on these small positive/negative fixtures.
      QRH_KERNEL_JOBS: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 tests/actions-worker.py prepare
      - name: Restore the shared checking environment
        uses: ./.github/actions/verifier-cache
      - name: Install worker prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends meson ninja-build libcap-dev pkg-config zstd libgmp-dev python3-yaml
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Build the pinned checking environment
        run: python3 verifier/actions/setup.py
      - name: Inspect the published compilation cache
        run: python3 verifier/actions/restore-build.py
      - name: Publish cache diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-cache-integration
          path: |
            verification/build-cache-status.json
            verification/build-cache-inputs.json
          retention-days: 7
      - name: Verify theta one
        run: python3 verifier/actions/run.py
      - name: Require the incomplete proof to fail for its forbidden axiom
        run: python3 tests/actions-worker.py reject
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-integration
          path: |
            verification/attempt.json
            verification/build-cache-status.json
            verification/accepted-attempt.json
            verification/certificate.json
            verification/accepted-run/logs/
            verification/accepted-run/judge/logs/
            verification/run/logs/
            verification/run/judge/logs/
            verification/run/phases.json
          retention-days: 30
