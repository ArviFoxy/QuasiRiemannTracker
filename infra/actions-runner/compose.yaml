services:
  runner:
    image: qrh-actions-runner:2.338.0
    build:
      context: .
    platform: linux/amd64
    runtime: runc
    cgroup: private
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - apparmor:docker-default
    # The immutable image entrypoint sets no_new_privs before starting the runner.
    # Docker-level NNP breaks snap Docker's AppArmor transition (LP#1908448).
    cpus: 4
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 512
    shm_size: 512m
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
      core: 0
    tmpfs:
      - /runner:rw,exec,nosuid,nodev,size=5g,uid=10001,gid=10001,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=1g,mode=1777
    environment:
      http_proxy: http://qrh-runner-proxy:3128
      https_proxy: http://qrh-runner-proxy:3128
      HTTP_PROXY: http://qrh-runner-proxy:3128
      HTTPS_PROXY: http://qrh-runner-proxy:3128
      no_proxy: localhost,127.0.0.1,::1
      NO_PROXY: localhost,127.0.0.1,::1
      NODE_USE_ENV_PROXY: "1"
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: "1"
    stdin_open: true
    tty: false
    restart: "no"
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - runner-internal

networks:
  runner-internal:
    name: qrh-runner-internal-${QRH_RUNNER_SLOT:?Select a runner slot with manage.py}
    external: true
